name: Prepare build environment
description: Check out the source, set up MSVC for ARM64 and restore the dependency cache.

inputs:
  repository:
    required: true
  ref:
    required: true
  token:
    required: true
  sdk:
    required: true
  cache-key:
    required: true

runs:
  using: composite
  steps:
    - name: Prepare directories
      shell: cmd
      run: |
        mkdir %USERPROFILE%\TBuild\Libraries
        mklink /d "%GITHUB_WORKSPACE%\TBuild" "%USERPROFILE%\TBuild"
        echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%

    # Checkout's credentials only apply to the exact path it configured,
    # but git resolves the TBuild link, so clone outside it and move in.
    - name: Check out source
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        token: ${{ inputs.token }}
        persist-credentials: false
        submodules: recursive
        path: src

    - name: Move source into place
      shell: cmd
      run: move "%GITHUB_WORKSPACE%\src" "%USERPROFILE%\TBuild\tdesktop"

    - name: Configure tools
      shell: bash
      run: |
        sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake
        git config --global user.email "ci@localhost"
        git config --global user.name "CI"

    - name: Install VS 2026 Build Tools
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri https://aka.ms/vs/18/stable/vs_buildtools.exe -OutFile vs_buildtools.exe
        $p = Start-Process -FilePath .\vs_buildtools.exe -Wait -PassThru -ArgumentList `
          '--quiet','--wait','--norestart','--nocache', `
          '--add','Microsoft.VisualStudio.Workload.VCTools', `
          '--add','Microsoft.VisualStudio.Component.VC.Tools.ARM64', `
          '--add','Microsoft.VisualStudio.Component.VC.ATL.ARM64'
        Remove-Item vs_buildtools.exe -Force
        if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }

    - name: Native Tools Command Prompt
      uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
      with:
        arch: arm64
        sdk: ${{ inputs.sdk }}

    - name: NuGet sources
      shell: cmd
      run: |
        nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
        nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

    # Newest complete entry for this prepare.py, else the newest partial one,
    # else anything older so only the changed stages rebuild after a sync.
    - name: Restore dependencies
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ github.workspace }}\TBuild\Libraries
          ${{ github.workspace }}\TBuild\ThirdParty
        key: winarm64-deps-${{ inputs.cache-key }}-complete
        restore-keys: |
          winarm64-deps-${{ inputs.cache-key }}-
          winarm64-deps-
